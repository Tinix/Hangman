name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    name: ${{ matrix.app }} (Elixir ${{ matrix.versions.elixir }}, OTP ${{ matrix.versions.otp }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        app: [dictionary, hangman, text_client]
        versions:
          - { elixir: '1.16.2', otp: '26.2.5' }
          - { elixir: '1.18.4', otp: '26.2.5' }
          - { elixir: '1.20.5', otp: '29.1.2' }

    # There is no root mix.exs: each app is a separate Mix project
    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: ${{ matrix.versions.elixir }}
        otp-version: ${{ matrix.versions.otp }}
        version-type: strict
    - name: Install dependencies
      run: mix deps.get
    - name: Compile
      run: mix compile --warnings-as-errors
      env:
        MIX_ENV: test
    - name: Run tests
      run: mix test --warnings-as-errors
